name: Temporary rebuild VecStore Nix package v2

on:
  push:
    branches:
      - vecstore-1.0.0

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vecstore-1.0.0
          fetch-depth: 1
          sparse-checkout: |
            .github
            maintainers
            pkgs/by-name/ve/vecstore

      - uses: cachix/install-nix-action@v31

      - name: Build exact current-master package and compute cargo hash
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add upstream https://github.com/NixOS/nixpkgs.git || true
          git fetch --depth=1 upstream master
          master_sha="$(git rev-parse FETCH_HEAD)"
          git reset --hard "$master_sha"
          git branch --set-upstream-to=upstream/master vecstore-1.0.0 || true

          python - <<'PY'
          from pathlib import Path

          path = Path("maintainers/maintainer-list.nix")
          text = path.read_text(encoding="utf-8")
          if "  philipjohnbasile = {\n" not in text:
              marker = "  Philipp-M = {\n"
              if marker not in text:
                  raise SystemExit("could not locate maintainer insertion point")
              entry = (
                  '  philipjohnbasile = {\n'
                  '    name = "Philip John Basile";\n'
                  '    email = "PhilipJohnBasile@gmail.com";\n'
                  '    github = "PhilipJohnBasile";\n'
                  '    githubId = 1419847;\n'
                  '  };\n'
              )
              text = text.replace(marker, entry + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git add maintainers/maintainer-list.nix
          git commit -s -m "maintainers: add philipjohnbasile"

          version="0.1.0-unstable-2026-09-01"
          revision="1868a6273174f58856af25ba6c45eb057d3bbfd0"
          source_url="https://github.com/PhilipJohnBasile/vecstore/archive/${revision}.tar.gz"
          source_hash="$(nix store prefetch-file --json --unpack "$source_url" | python -c 'import json,sys; print(json.load(sys.stdin)["hash"])')"
          echo "VecStore Nix source hash: ${source_hash}"

          mkdir -p pkgs/by-name/ve/vecstore
          cat > pkgs/by-name/ve/vecstore/package.nix <<EOF
          {
            lib,
            rustPlatform,
            fetchFromGitHub,
            pkg-config,
            protobuf,
            unstableGitUpdater,
          }:

          rustPlatform.buildRustPackage (finalAttrs: {
            pname = "vecstore";
            version = "${version}";
            src = fetchFromGitHub {
              owner = "PhilipJohnBasile";
              repo = "vecstore";
              rev = "${revision}";
              hash = "${source_hash}";
            };

            cargoHash = lib.fakeHash;

            nativeBuildInputs = [
              pkg-config
              protobuf
            ];

            buildFeatures = [ "server" ];

            cargoBuildFlags = [
              "--bin"
              "vecstore-server"
            ];

            passthru.updateScript = unstableGitUpdater { };

            meta = {
              description = "Embeddable vector database with HNSW search and RAG tooling";
              homepage = "https://github.com/PhilipJohnBasile/vecstore";
              license = lib.licenses.mit;
              maintainers = [ lib.maintainers.philipjohnbasile ];
              mainProgram = "vecstore-server";
              platforms = lib.platforms.unix;
            };
          })
          EOF

          formatter_ref="github:NixOS/nixpkgs/${master_sha}#nixfmt"
          nix shell "$formatter_ref" -c nixfmt pkgs/by-name/ve/vecstore/package.nix
          nix-instantiate --parse pkgs/by-name/ve/vecstore/package.nix >/dev/null

          package_path="${GITHUB_WORKSPACE}/pkgs/by-name/ve/vecstore/package.nix"
          nixpkgs_url="https://github.com/NixOS/nixpkgs/archive/${master_sha}.tar.gz"
          build_expr="let
            pkgs = import (builtins.fetchTarball \"${nixpkgs_url}\") { };
            lib = pkgs.lib // {
              maintainers = pkgs.lib.maintainers // {
                philipjohnbasile = {
                  name = \"Philip John Basile\";
                  email = \"PhilipJohnBasile@gmail.com\";
                  github = \"PhilipJohnBasile\";
                  githubId = 1419847;
                };
              };
            };
          in pkgs.callPackage ${package_path} { inherit lib; }"

          set +e
          nix-build --cores 1 --no-out-link -E "$build_expr" 2>&1 | tee /tmp/vecstore-fake-hash.log
          build_rc=${PIPESTATUS[0]}
          set -e
          test "$build_rc" -ne 0
          cargo_hash="$(sed -n -E 's/^[[:space:]]+got:[[:space:]]+(sha256-[A-Za-z0-9+\/=]+)$/\1/p' /tmp/vecstore-fake-hash.log | tail -1)"
          test -n "$cargo_hash"
          echo "VecStore cargo hash: ${cargo_hash}"
          python - "$cargo_hash" <<'PY'
          from pathlib import Path
          import sys

          path = Path("pkgs/by-name/ve/vecstore/package.nix")
          text = path.read_text(encoding="utf-8")
          old = "  cargoHash = lib.fakeHash;\n"
          new = f'  cargoHash = "{sys.argv[1]}";\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one fake cargo hash")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          nix shell "$formatter_ref" -c nixfmt pkgs/by-name/ve/vecstore/package.nix
          nix-instantiate --parse pkgs/by-name/ve/vecstore/package.nix >/dev/null
          nix-build --cores 1 --no-out-link -E "$build_expr"
          git diff --check
          git add pkgs/by-name/ve/vecstore/package.nix
          git commit -s -m "vecstore: init at ${version}"

          test "$(git rev-list --count "$master_sha"..HEAD)" = "2"
          test "$(git log --format=%s "$master_sha"..HEAD | tail -1)" = "maintainers: add philipjohnbasile"
          test "$(git log -1 --format=%s)" = "vecstore: init at ${version}"
          test ! -e .github/workflows/temporary-rebuild-vecstore-nix-v2.yml
          git diff --check "$master_sha"...HEAD

      - name: Publish clean candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/PhilipJohnBasile/nixpkgs.git" \
            HEAD:sync/vecstore-nix-ready-v2 \
            --force-with-lease=refs/heads/sync/vecstore-nix-ready-v2:dab930edcfdf4ea9cb1eae64b60577599dae79ea
